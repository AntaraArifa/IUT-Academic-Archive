<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Calculator</title>
<style>
  body { font-family: Arial, sans-serif; background: #1e1e2f; color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .container { background: #2a2a40; padding: 32px; border-radius: 12px; width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .back { color: #9fb3ff; text-decoration: none; display: inline-block; margin-bottom: 16px; }
  h2 { margin-top: 24px; margin-bottom: 8px; font-size: 1.1em; color: #9fb3ff; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input { flex: 1; min-width: 80px; padding: 8px; border-radius: 6px; border: none; }
  button { padding: 10px 16px; border: none; border-radius: 6px; background: #4f7cff; color: white; font-weight: bold; cursor: pointer; }
  button:hover { background: #6a91ff; }
  p.result { font-size: 1.05em; margin-top: 8px; }
</style>
</head>
<body>
  <div class="container">
    <a class="back" href="index.html">&larr; Home</a>
    <h1>Custom Calculator</h1>
    <p style="color:#c7c7d9; font-size:0.9em;">Combines the Basic and Advanced modules to model real financial calculations.</p>

    <h2>Compound Interest</h2>
    <div class="row">
      <input type="number" id="principal" placeholder="Principal">
      <input type="number" id="rate" placeholder="Rate (%)">
      <input type="number" id="time" placeholder="Time (yrs)">
    </div>
    <button onclick="calcCompound()">Calculate</button>
    <p class="result" id="compoundResult"></p>

    <h2>Installment Plan</h2>
    <div class="row">
      <input type="number" id="totalAmount" placeholder="Total amount">
      <input type="number" id="months" placeholder="Months">
    </div>
    <button onclick="calcInstallment()">Calculate</button>
    <p class="result" id="installmentResult"></p>
  </div>

  <script src="Scripts/basic.js"></script>
  <script src="Scripts/advanced.js"></script>
  <script src="Scripts/custom.js"></script>
  <script>
    function calcCompound() {
      const el = document.getElementById('compoundResult');
      try {
        const principal = parseFloat(document.getElementById('principal').value);
        const rate = parseFloat(document.getElementById('rate').value);
        const time = parseFloat(document.getElementById('time').value);
        const result = window.custom.compoundInterest(principal, rate, time);
        el.textContent = `Final amount: ${result.amount} | Interest earned: ${result.interest}`;
      } catch (e) {
        el.textContent = 'Error: ' + e.message;
      }
    }

    function calcInstallment() {
      const el = document.getElementById('installmentResult');
      try {
        const totalAmount = parseFloat(document.getElementById('totalAmount').value);
        const months = parseInt(document.getElementById('months').value, 10);
        const result = window.custom.installmentPlan(totalAmount, months);
        el.textContent = `Monthly installment: ${result.installment} | Remainder: ${result.remainder}`;
      } catch (e) {
        el.textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
